<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160">
  <!-- Floral medallion on the left — concentric pink ring with petal accents -->
  <g transform="translate(80, 80)">
    <circle r="56" fill="none" stroke="#E61E84" stroke-width="2"/>
    <circle r="44" fill="none" stroke="#E61E84" stroke-width="1" opacity="0.55"/>
    <!-- 8 petals around -->
    <g fill="#E61E84" opacity="0.85">
      <ellipse cx="0"   cy="-44" rx="6" ry="11"/>
      <ellipse cx="31"  cy="-31" rx="6" ry="11" transform="rotate(45 31 -31)"/>
      <ellipse cx="44"  cy="0"   rx="6" ry="11" transform="rotate(90 44 0)"/>
      <ellipse cx="31"  cy="31"  rx="6" ry="11" transform="rotate(135 31 31)"/>
      <ellipse cx="0"   cy="44"  rx="6" ry="11"/>
      <ellipse cx="-31" cy="31"  rx="6" ry="11" transform="rotate(-135 -31 31)"/>
      <ellipse cx="-44" cy="0"   rx="6" ry="11" transform="rotate(-90 -44 0)"/>
      <ellipse cx="-31" cy="-31" rx="6" ry="11" transform="rotate(-45 -31 -31)"/>
    </g>
    <!-- center -->
    <circle r="6" fill="#E61E84"/>
  </g>
  <!-- ARDIEM wordmark -->
  <text x="170" y="108"
        font-family="'Times New Roman', 'Georgia', serif"
        font-weight="500"
        font-size="92"
        letter-spacing="6"
        fill="#E61E84">ARDIEM</text>
</svg>
